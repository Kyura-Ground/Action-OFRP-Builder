name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Kyura-Ground/orangefox_asus_X00TD'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'OrangeFox'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/asus/X00TD'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'X00TD'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_X00TD'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SYNC_URL: ${{ inputs.SYNC_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      MAKEFILE_NAME: ${{ inputs.MAKEFILE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      COMMON_TREE_URL: ${{ inputs.COMMON_TREE_URL }}
      COMMON_PATH: ${{ inputs.COMMON_PATH }}
    permissions:
      contents: write
    steps:

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        fetch-tags: false

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$PWD" >> "$GITHUB_OUTPUT"
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            git python3 tar aria2
        git clone --depth=1 --single-branch --no-tags https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.SYNC_URL, 'git@github.com') ||
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources
      run: |
        git clone --depth=1 --single-branch --no-tags -- "$SYNC_URL" sync
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync.py" sync/orangefox_sync.sh
        bash -n sync/orangefox_sync.sh
        source_dir="$PWD/fox_$MANIFEST_BRANCH"
        (cd sync && bash orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "$source_dir")
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: git clone --depth=1 --single-branch --no-tags --branch "$DEVICE_TREE_BRANCH" -- "$DEVICE_TREE_URL" "$DEVICE_PATH"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone common tree
      if: inputs.COMMON_TREE_URL != '' && inputs.COMMON_PATH != ''
      run: git clone --depth=1 --single-branch --no-tags --branch "$DEVICE_TREE_BRANCH" -- "$COMMON_TREE_URL" "$COMMON_PATH"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build and verify recovery
      run: |
        if [[ "$DEVICE_PATH" == device/asus/X00TD ]]; then
          [[ "$MANIFEST_BRANCH" == 12.1 && "$MAKEFILE_NAME" == twrp_X00TD && "$BUILD_TARGET" == recovery ]]
          bash "$DEVICE_PATH/script.sh" 2>&1 | tee "$GITHUB_WORKSPACE/recovery-build.log"
        else
          set +e
          source build/envsetup.sh
          unset ALLOW_MISSING_DEPENDENCIES
          lunch "$MAKEFILE_NAME-eng"
          lunch_status=$?
          set -e
          if (( lunch_status != 0 )); then
            exit "$lunch_status"
          fi
          m -j"$(nproc)" "${BUILD_TARGET}image" 2>&1 | tee "$GITHUB_WORKSPACE/recovery-build.log"
        fi
        test -s "out/target/product/$DEVICE_NAME/${BUILD_TARGET}.img"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recovery-build-logs-${{ github.run_id }}
        if-no-files-found: ignore
        path: |
          recovery-build.log
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ inputs.MANIFEST_BRANCH }}/out/soong/build.ninja.d
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ inputs.MANIFEST_BRANCH }}/out/error.log

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        fail_on_unmatched_files: true
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
